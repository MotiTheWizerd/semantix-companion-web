[package]
name = "semantix-companion"
version = "0.1.0"
description = "Semantix Companion desktop application"
authors = ["Moti and Codex"]
edition = "2021"

[lib]
name = "semantix_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4.1.6"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
uuid = { version = "1.24.1", features = ["v4"] }
zeroize = "1.9.0"

[dev-dependencies]
serde_json = "1"
